name: gallery
# Builds the listening gallery from real public repos and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # every Monday, so the demos keep up with new commits

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Clone the demo repos
        run: |
          mkdir -p ../demo-repos && cd ../demo-repos
          for r in expressjs/express junegunn/fzf antirez/linenoise antirez/kilo stevemao/left-pad kelseyhightower/nocode; do
            git clone --quiet --no-checkout "https://github.com/$r.git" "${r#*/}"
          done
      - name: Build the gallery
        run: |
          D=../demo-repos
          node scripts/gallery.js $D/express $D/fzf $D/linenoise $D/kilo $D/left-pad $D/nocode
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
